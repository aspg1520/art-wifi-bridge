<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ART WIFI HOTSPOT - Status</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #02081d 0%, #0d1b3e 100%);
            --primary-blue: #0072ff;
            --neon-cyan: #00f0ff;
            --neon-green: #00ff88;
            --danger-red: #ff3333;
            --dark-card: #0d1b3e;
            --border-radius: 16px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            font-family: var(--font-family);
            background: var(--bg-gradient);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .portal-container {
            width: 100%;
            max-width: 420px;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            position: relative;
            width: 100%;
            max-height: 96dvh;
            background: rgba(13, 27, 62, 0.96);
            border-radius: var(--border-radius);
            padding: 18px 14px;
            text-align: center;
            border: 2px solid rgba(0, 240, 255, 0.5);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
        }

        .network-status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            padding: 4px 12px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--neon-green);
        }

        .logo-header {
            width: 100%; 
            max-width: 110px; 
            margin: 0 auto 6px auto; 
            display: block;
        }

        .form-title-container {
            width: 100%;
            border: solid 1.5px var(--neon-cyan);
            border-radius: 12px;
            margin: 2px auto 8px auto;
            overflow: hidden;
            background: rgba(0, 240, 255, 0.03);
            padding: 5px 8px;
            box-sizing: border-box;
        }

        .form-title {
            font-size: 14px; 
            font-weight: 900; 
            margin: 0;
            color: #ffffff;
            text-transform: uppercase; 
            letter-spacing: 1px;
            text-align: center;
        }

        .info-group {
            background: rgba(0, 240, 255, 0.04);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 8px 12px;
            border-radius: 12px;
            margin-top: 4px;
            text-align: left;
            font-size: 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }

        .info-value {
            color: var(--neon-cyan);
            font-weight: 800;
            font-family: monospace;
        }

        .logout-btn {
            width: 100%;
            height: 42px;
            border-radius: 10px;
            background: var(--danger-red);
            color: #ffffff;
            font-weight: 900;
            border: none;
            cursor: pointer;
            font-size: 14px;
            margin-top: 12px;
        }

        #oper-hint { 
            color: var(--neon-cyan); 
            font-size: 10px; 
            font-weight: 600; 
            margin-top: 8px; 
            display: block; 
            background: rgba(0, 240, 255, 0.05);
            border: 1px dashed rgba(0, 240, 255, 0.3);
            padding: 5px 8px;
            border-radius: 8px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="portal-container">
    <div class="main-card">
        <div class="network-status-badge">
            <span class="status-dot"></span>
            <span id="status-text">Fetching Session...</span>
        </div>

        <img class="logo-header" src="ART WIFI HOTSPOT LOGO.png" alt="ART WIFI LOGO">

        <div class="form-title-container">
            <h1 class="form-title">⚡ SESSION STATUS ⚡</h1>
        </div>

        <div class="info-group">
            <div class="info-row">
                <span class="info-label">User Name:</span>
                <span class="info-value" id="val-username">Detecting...</span>
            </div>
            <div class="info-row">
                <span class="info-label">IP Address:</span>
                <span class="info-value" id="val-ip">Detecting...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Uptime:</span>
                <span class="info-value" id="val-uptime">0s</span>
            </div>
            <div class="info-row">
                <span class="info-label">Used Time:</span>
                <span class="info-value" id="val-used">0s</span>
            </div>
            <div class="info-row">
                <span class="info-label">Remaining Time:</span>
                <span class="info-value" id="val-remaining" style="color: var(--neon-cyan);">00:00:00</span>
            </div>
        </div>

        <button id="logout-btn" class="logout-btn">Log Out</button>

        <span id="oper-hint">💡 Huwag i-close ang tab na ito para tuloy-tuloy ang iyong koneksyon.</span>
    </div>
</div>

<script>
    var API_URL = "https://art-wifi-bridge.onrender.com";
    var clientMac = "";
    var apMac = "";
    var ssidName = "";
    var cliToken = "";
    
    var uptimeSeconds = 0;
    var usedSeconds = 0;
    var remainingSeconds = 0;
    var clockInterval = null;
    var syncInterval = null;
    var isTimerRunning = false;

    function parseURLParams() {
        var params = new URLSearchParams(window.location.search);
        clientMac = params.get('clientMac') || params.get('mac') || params.get('id') || '';
        var usernameParam = params.get('username') || params.get('voucher') || '';

        apMac = params.get('apMac') || '';
        ssidName = params.get('ssidName') || params.get('ssid') || '';
        cliToken = params.get('cliToken') || '';

        if (usernameParam) {
            document.getElementById('val-username').innerText = usernameParam;
        }
    }

    function formatDuration(totalSeconds) {
        if (totalSeconds <= 0) return "0s";
        var hrs = Math.floor(totalSeconds / 3600);
        var mins = Math.floor((totalSeconds % 3600) / 60);
        var secs = totalSeconds % 60;
        
        if (hrs > 0) return hrs + "h " + mins + "m " + secs + "s";
        if (mins > 0) return mins + "m " + secs + "s";
        return secs + "s";
    }

    function formatCountdown(totalSeconds) {
        if (totalSeconds <= 0) return "00:00:00";
        var hrs = Math.floor(totalSeconds / 3600);
        var mins = Math.floor((totalSeconds % 3600) / 60);
        var secs = totalSeconds % 60;

        return (hrs < 10 ? "0" + hrs : hrs) + ":" + 
               (mins < 10 ? "0" + mins : mins) + ":" + 
               (secs < 10 ? "0" + secs : secs);
    }

    function startLiveClocks() {
        if (clockInterval) clearInterval(clockInterval);

        clockInterval = setInterval(function() {
            if (!isTimerRunning) return;

            uptimeSeconds++;
            usedSeconds++;
            if (remainingSeconds > 0) {
                remainingSeconds--;
            }

            document.getElementById('val-uptime').innerText = formatDuration(uptimeSeconds);
            document.getElementById('val-used').innerText = formatDuration(usedSeconds);
            document.getElementById('val-remaining').innerText = formatCountdown(remainingSeconds);

            if (remainingSeconds <= 0) {
                document.getElementById('val-remaining').innerText = "EXPIRED";
                document.getElementById('val-remaining').style.color = "var(--danger-red)";
                document.getElementById('status-text').innerText = "Session Expired";
            }
        }, 1000);
    }

    async function fetchSessionStatus() {
        try {
            let requestUrl = `${API_URL}/api/check-time?`;
            let params = [];

            if (clientMac) params.push(`mac=${encodeURIComponent(clientMac)}`);
            if (apMac) params.push(`apMac=${encodeURIComponent(apMac)}`);
            if (ssidName) params.push(`ssidName=${encodeURIComponent(ssidName)}`);
            if (cliToken) params.push(`cliToken=${encodeURIComponent(cliToken)}`);

            let res = await fetch(requestUrl + params.join('&'));
            let data = await res.json();

            if (data.success) {
                if (data.ip) document.getElementById('val-ip').innerText = data.ip;
                if (data.mac && !clientMac) clientMac = data.mac;
                if (data.voucherCode && data.voucherCode !== 'ACTIVE') {
                    document.getElementById('val-username').innerText = data.voucherCode;
                }
                if (typeof data.remainingSeconds !== 'undefined') {
                    remainingSeconds = data.remainingSeconds;
                }
                if (typeof data.uptime !== 'undefined') {
                    uptimeSeconds = data.uptime;
                }
                if (typeof data.usedTime !== 'undefined') {
                    usedSeconds = data.usedTime;
                }

                document.getElementById('status-text').innerText = "Authentication Success";
                isTimerRunning = true;
            } else {
                document.getElementById('val-username').innerText = "No Active Session";
                document.getElementById('val-ip').innerText = "N/A";
                document.getElementById('status-text').innerText = "Waiting for Connection";
            }
        } catch (err) {
            console.log("Sync error:", err);
        }
    }

    document.getElementById('logout-btn').addEventListener('click', async function() {
        if (confirm("Sigurado ka bang gusto mong mag-log out sa Wi-Fi?")) {
            try {
                let logoutUrl = `${API_URL}/api/logout?mac=${encodeURIComponent(clientMac)}`;
                if (apMac) logoutUrl += `&apMac=${encodeURIComponent(apMac)}`;
                if (ssidName) logoutUrl += `&ssidName=${encodeURIComponent(ssidName)}`;
                if (cliToken) logoutUrl += `&cliToken=${encodeURIComponent(cliToken)}`;
                await fetch(logoutUrl).catch(e => {});
            } catch(e) {}
            
            alert("Naka-log out ka na sa network.");
            window.location.reload();
        }
    });

    window.addEventListener("DOMContentLoaded", async function() {
        parseURLParams();
        startLiveClocks();
        await fetchSessionStatus();

        if (syncInterval) clearInterval(syncInterval);
        syncInterval = setInterval(fetchSessionStatus, 10000);
    });
</script>
</body>
</html>
