<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ART WIFI HOTSPOT - Status</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #02081d 0%, #0d1b3e 100%);
            --primary-blue: #0072ff;
            --neon-cyan: #00f0ff;
            --neon-green: #00ff88;
            --danger-red: #ff3333;
            --gold-yellow: #fbc02d;
            --dark-card: #0d1b3e;
            --border-radius: 16px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            font-family: var(--font-family);
            background: var(--bg-gradient);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .portal-container {
            width: 100%;
            max-width: 420px;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            position: relative;
            width: 100%;
            max-height: 96dvh;
            background: rgba(13, 27, 62, 0.96);
            border-radius: var(--border-radius);
            padding: 18px 14px;
            text-align: center;
            border: 2px solid rgba(0, 240, 255, 0.5);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            animation: cardBreathingGlow 4s infinite ease-in-out;
            -webkit-overflow-scrolling: touch;
        }

        @keyframes cardBreathingGlow {
            0%, 100% { border-color: rgba(0, 240, 255, 0.4); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
            50% { border-color: rgba(0, 240, 255, 0.85); box-shadow: 0 0 25px rgba(0, 240, 255, 0.4); }
        }

        .network-status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            padding: 4px 12px;
            margin-bottom: 10px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--neon-green);
            animation: blinkDot 1.5s infinite ease-in-out;
        }

        @keyframes blinkDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .logo-header {
            width: 100%; 
            max-width: 110px; 
            margin: 0 auto 6px auto; 
            display: block;
            animation: bounceLogo 2.5s infinite ease-in-out;
        }

        @keyframes bounceLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .form-title-container {
            width: 100%;
            border: solid 1.5px var(--neon-cyan);
            border-radius: 12px;
            margin: 2px auto 8px auto;
            overflow: hidden;
            background: rgba(0, 240, 255, 0.03);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            padding: 5px 8px;
            box-sizing: border-box;
        }

        .form-title {
            font-size: 14px; 
            font-weight: 900; 
            margin: 0;
            color: #ffffff;
            text-transform: uppercase; 
            letter-spacing: 1px;
            text-shadow: 0 0 8px var(--neon-cyan);
            text-align: center;
        }

        .info-group {
            background: rgba(0, 240, 255, 0.04);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 8px 12px;
            border-radius: 12px;
            margin-top: 4px;
            text-align: left;
            font-size: 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }

        .info-value {
            color: var(--neon-cyan);
            font-weight: 800;
            font-family: monospace;
        }

        .logout-btn {
            width: 100%;
            height: 42px;
            border-radius: 10px;
            background: var(--danger-red);
            color: #ffffff;
            font-weight: 900;
            border: none;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            margin-top: 12px;
            box-shadow: 0 0 12px rgba(255, 51, 51, 0.4);
            transition: 0.2s;
        }

        .logout-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        #oper-hint { 
            color: var(--neon-cyan); 
            font-size: 10px; 
            font-weight: 600; 
            margin-top: 8px; 
            display: block; 
            line-height: 1.3;
            background: rgba(0, 240, 255, 0.05);
            border: 1px dashed rgba(0, 240, 255, 0.3);
            padding: 5px 8px;
            border-radius: 8px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="portal-container">
    <div class="main-card">
        <div class="network-status-badge">
            <span class="status-dot"></span>
            <span id="status-text">Authentication Success</span>
        </div>

        <img class="logo-header" src="ART WIFI HOTSPOT LOGO.png" alt="ART WIFI LOGO">

        <div class="form-title-container">
            <h1 class="form-title">⚡ SESSION STATUS ⚡</h1>
        </div>

        <div class="info-group">
            <div class="info-row">
                <span class="info-label">User Name:</span>
                <span class="info-value" id="val-username">--</span>
            </div>
            <div class="info-row">
                <span class="info-label">IP Address:</span>
                <span class="info-value" id="val-ip">--</span>
            </div>
            <div class="info-row">
                <span class="info-label">Uptime:</span>
                <span class="info-value" id="val-uptime">0s</span>
            </div>
            <div class="info-row">
                <span class="info-label">Used Time:</span>
                <span class="info-value" id="val-used">0s</span>
            </div>
            <div class="info-row">
                <span class="info-label">Remaining Time:</span>
                <span class="info-value" id="val-remaining" style="color: var(--neon-cyan);">00:00:00</span>
            </div>
        </div>

        <button id="logout-btn" class="logout-btn">Log Out</button>

        <span id="oper-hint">💡 Huwag i-close ang tab na ito para tuloy-tuloy ang iyong koneksyon.</span>
    </div>
</div>

<script>
    var API_URL = "https://art-wifi-bridge.onrender.com";
    var clientMac = "NOT_AVAILABLE";
    var apMac = "";
    var ssidName = "";
    var cliToken = "";
    var redirectUrl = "";
    
    var uptimeSeconds = 0;
    var usedSeconds = 0;
    var remainingSeconds = 0;
    var syncInterval = null;
    var clockInterval = null;

    function parseURLParams() {
        var params = new URLSearchParams(window.location.search);
        clientMac = params.get('clientMac') || params.get('mac') || params.get('id') || localStorage.getItem('art_wifi_mac') || 'NOT_AVAILABLE';
        var usernameParam = params.get('username') || params.get('voucher') || localStorage.getItem('art_wifi_username') || '--';

        apMac = params.get('apMac') || localStorage.getItem('art_wifi_apMac') || '';
        ssidName = params.get('ssidName') || params.get('ssid') || localStorage.getItem('art_wifi_ssid') || '';
        cliToken = params.get('cliToken') || localStorage.getItem('art_wifi_cliToken') || '';
        redirectUrl = params.get('redirectUrl') || '';

        if (clientMac !== 'NOT_AVAILABLE') localStorage.setItem('art_wifi_mac', clientMac);
        if (apMac) localStorage.setItem('art_wifi_apMac', apMac);
        if (ssidName) localStorage.setItem('art_wifi_ssid', ssidName);
        if (cliToken) localStorage.setItem('art_wifi_cliToken', cliToken);
        if (usernameParam && usernameParam !== '--') localStorage.setItem('art_wifi_username', usernameParam);

        document.getElementById('val-username').innerText = usernameParam;
        if (clientMac !== 'NOT_AVAILABLE') {
            // Pansamantalang ilagay habang nag-aantay sa server response
            document.getElementById('val-ip').innerText = "Detecting...";
        }
    }

    function formatDuration(totalSeconds) {
        if (totalSeconds <= 0) return "0s";
        var hrs = Math.floor(totalSeconds / 3600);
        var mins = Math.floor((totalSeconds % 3600) / 60);
        var secs = totalSeconds % 60;
        
        if (hrs > 0) {
            return hrs + "h " + mins + "m " + secs + "s";
        } else if (mins > 0) {
            return mins + "m " + secs + "s";
        } else {
            return secs + "s";
        }
    }

    function formatCountdown(totalSeconds) {
        if (totalSeconds <= 0) return "00:00:00";
        var hrs = Math.floor(totalSeconds / 3600);
        var mins = Math.floor((totalSeconds % 3600) / 60);
        var secs = totalSeconds % 60;

        return (hrs < 10 ? "0" + hrs : hrs) + ":" + 
               (mins < 10 ? "0" + mins : mins) + ":" + 
               (secs < 10 ? "0" + secs : secs);
    }

    function startLiveClocks() {
        if (clockInterval) clearInterval(clockInterval);

        clockInterval = setInterval(function() {
            uptimeSeconds++;
            usedSeconds++;
            if (remainingSeconds > 0) {
                remainingSeconds--;
            }

            document.getElementById('val-uptime').innerText = formatDuration(uptimeSeconds);
            document.getElementById('val-used').innerText = formatDuration(usedSeconds);
            document.getElementById('val-remaining').innerText = formatCountdown(remainingSeconds);

            if (remainingSeconds <= 0) {
                document.getElementById('val-remaining').innerText = "EXPIRED";
                document.getElementById('val-remaining').style.color = "var(--danger-red)";
                document.getElementById('status-text').innerText = "Session Expired";
            }
        }, 1000);
    }

    async function fetchSessionStatus() {
        try {
            let requestUrl = `${API_URL}/api/check-time?`;
            let params = [];

            if (clientMac && clientMac !== 'NOT_AVAILABLE') params.push(`mac=${encodeURIComponent(clientMac)}`);
            if (apMac) params.push(`apMac=${encodeURIComponent(apMac)}`);
            if (ssidName) params.push(`ssidName=${encodeURIComponent(ssidName)}`);
            if (cliToken) params.push(`cliToken=${encodeURIComponent(cliToken)}`);

            let res = await fetch(requestUrl + params.join('&'));
            let data = await res.json();

            if (data.success) {
                if (data.ip) document.getElementById('val-ip').innerText = data.ip;
                if (data.voucherCode && data.voucherCode !== 'ACTIVE') {
                    document.getElementById('val-username').innerText = data.voucherCode;
                    localStorage.setItem('art_wifi_username', data.voucherCode);
                }
                if (typeof data.remainingSeconds !== 'undefined') {
                    remainingSeconds = data.remainingSeconds;
                }
                if (typeof data.uptime !== 'undefined') {
                    uptimeSeconds = data.uptime;
                } else if (uptimeSeconds === 0) {
                    uptimeSeconds = 1; // fallback kung wala pa
                }
                if (typeof data.usedTime !== 'undefined') {
                    usedSeconds = data.usedTime;
                } else if (usedSeconds === 0) {
                    usedSeconds = uptimeSeconds;
                }
            }
        } catch (err) {
            console.log("Sync error:", err);
        }
    }

    // Log Out button action (tumatawag sa Omada logout o nagre-redirect pabalik)
    document.getElementById('logout-btn').addEventListener('click', async function() {
        if (confirm("Sigurado ka bang gusto mong mag-log out sa Wi-Fi?")) {
            try {
                // Subukang tawagin ang logout endpoint sa server kung mayroon man, o direktang i-clear
                let logoutUrl = `${API_URL}/api/logout?mac=${encodeURIComponent(clientMac)}`;
                if (apMac) logoutUrl += `&apMac=${encodeURIComponent(apMac)}`;
                if (ssidName) logoutUrl += `&ssidName=${encodeURIComponent(ssidName)}`;
                if (cliToken) logoutUrl += `&cliToken=${encodeURIComponent(cliToken)}`;
                await fetch(logoutUrl).catch(e => {});
            } catch(e) {}
            
            localStorage.clear();
            alert("Nakabawas o naka-log out ka na sa network.");
            window.location.reload();
        }
    });

    window.addEventListener("DOMContentLoaded", async function() {
        parseURLParams();
        startLiveClocks();
        
        await fetchSessionStatus();

        // Background auto-sync bawat 10 segundo
        if (syncInterval) clearInterval(syncInterval);
        syncInterval = setInterval(fetchSessionStatus, 10000);
    });
</script>
</body>
</html>
