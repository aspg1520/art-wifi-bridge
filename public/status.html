<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ART WIFI HOTSPOT - Status</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #02081d 0%, #0d1b3e 100%);
            --primary-blue: #0072ff;
            --neon-cyan: #00f0ff;
            --neon-green: #00ff88;
            --danger-red: #ff3333;
            --gold-yellow: #fbc02d;
            --dark-card: #0d1b3e;
            --border-radius: 16px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --button-height: 44px;
            --font-size: 14px;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            font-family: var(--font-family);
            background: var(--bg-gradient);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .portal-container {
            width: 100%;
            max-width: 420px;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            position: relative;
            width: 100%;
            max-height: 96dvh;
            background: rgba(13, 27, 62, 0.96);
            border-radius: var(--border-radius);
            padding: 20px 14px;
            text-align: center;
            border: 2px solid rgba(0, 240, 255, 0.5);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            transform: translate3d(0, 0, 0);
            animation: cardBreathingGlow 4s infinite ease-in-out;
            -webkit-overflow-scrolling: touch;
        }

        @keyframes cardBreathingGlow {
            0%, 100% { border-color: rgba(0, 240, 255, 0.4); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
            50% { border-color: rgba(0, 240, 255, 0.85); box-shadow: 0 0 25px rgba(0, 240, 255, 0.4); }
        }

        .network-status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            padding: 4px 12px;
            margin-bottom: 12px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--neon-green);
            animation: blinkDot 1.5s infinite ease-in-out;
        }

        @keyframes blinkDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .logo-header {
            width: 100%; 
            max-width: 130px; 
            margin: 0 auto 8px auto; 
            display: block;
            animation: bounceLogo 2.5s infinite ease-in-out;
        }

        @keyframes bounceLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .form-title-container {
            width: 100%;
            border: solid 1.5px var(--neon-cyan);
            border-radius: 14px;
            margin: 4px auto 10px auto;
            overflow: hidden;
            background: rgba(0, 240, 255, 0.03);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            padding: 6px 8px;
            box-sizing: border-box;
        }

        .form-title {
            font-size: 15px; 
            font-weight: 900; 
            margin: 0;
            color: #ffffff;
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px var(--neon-cyan);
            text-align: center;
        }

        .timer-box {
            font-size: 36px;
            font-weight: 900;
            margin: 10px 0;
            font-family: monospace;
            color: var(--neon-cyan);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        .info-group {
            background: rgba(0, 240, 255, 0.04);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 10px 12px;
            border-radius: 12px;
            margin-top: 8px;
            text-align: left;
            font-size: 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }

        .info-value {
            color: var(--neon-cyan);
            font-weight: 800;
            font-family: monospace;
        }

        /* Manual Check Form Styles */
        .manual-box {
            margin-top: 12px;
            background: rgba(0, 240, 255, 0.03);
            border: 1px solid rgba(0, 240, 255, 0.25);
            padding: 10px;
            border-radius: 12px;
        }

        .voucher-input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--neon-cyan);
            background: rgba(2, 8, 29, 0.8);
            color: #fff;
            text-align: center;
            font-size: 15px;
            font-family: monospace;
            box-sizing: border-box;
            margin-bottom: 8px;
            outline: none;
            letter-spacing: 1px;
        }

        .check-btn {
            width: 100%;
            height: 38px;
            border-radius: 8px;
            background: var(--neon-cyan);
            color: #02081d;
            font-weight: 900;
            border: none;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }

        .check-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        #oper-hint { 
            color: var(--neon-cyan); 
            font-size: 10px; 
            font-weight: 600; 
            margin-top: 10px; 
            display: block; 
            line-height: 1.3;
            background: rgba(0, 240, 255, 0.05);
            border: 1px dashed rgba(0, 240, 255, 0.3);
            padding: 6px 10px;
            border-radius: 8px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="portal-container">
    <div class="main-card">
        <div class="network-status-badge">
            <span class="status-dot"></span>
            <span id="status-text">CONNECTED</span>
            <span style="opacity: 0.4;">|</span>
            <span style="color: var(--neon-cyan);">Ping: <span id="ping-val">12</span>ms</span>
        </div>

        <img class="logo-header" src="ART WIFI HOTSPOT LOGO.png" alt="ART WIFI LOGO">

        <div class="form-title-container">
            <h1 class="form-title">⚡ VOUCHER STATUS ⚡</h1>
        </div>

        <div class="timer-box" id="time-remaining">00:00:00</div>

        <div class="info-group">
            <div class="info-row">
                <span class="info-label">MAC Address:</span>
                <span class="info-value" id="client-mac">NOT_AVAILABLE</span>
            </div>
            <div class="info-row">
                <span class="info-label">Voucher Code:</span>
                <span class="info-value" id="voucher-display">INPUT CODE BELOW</span>
            </div>
        </div>

        <!-- Manual Voucher Input Section -->
        <div class="manual-box">
            <input type="text" id="voucher-input" class="voucher-input" placeholder="ENTER VOUCHER CODE" autocomplete="off">
            <button id="check-btn" class="check-btn">CHECK REMAINING TIME</button>
        </div>

        <span id="oper-hint">💡 Huwag i-close ang tab na ito para tuloy-tuloy ang iyong koneksyon.</span>
    </div>
</div>

<script>
    // Nakaturo na sa Render Web Service URL mo
    var API_URL = "https://art-wifi-bridge.onrender.com";
    var clientMac = "NOT_AVAILABLE";
    var apMac = "";
    var ssidName = "";
    var cliToken = "";
    var remainingSeconds = 0;
    var timerInterval = null;
    var syncInterval = null;

    // Kunin ang query parameters o localStorage
    function parseURLParams() {
        var params = new URLSearchParams(window.location.search);
        clientMac = params.get('clientMac') || params.get('mac') || params.get('id') || 'NOT_AVAILABLE';
        var voucherParam = params.get('voucher') || params.get('username') || '';

        // Mga bagong parameter mula sa Omada Portal pagkatapos mag-authenticate —
        // ito ang gagamitin natin para makuha ang EKSAKTONG remaining time.
        apMac = params.get('apMac') || localStorage.getItem('art_wifi_apMac') || '';
        ssidName = params.get('ssidName') || params.get('ssid') || localStorage.getItem('art_wifi_ssid') || '';
        cliToken = params.get('cliToken') || localStorage.getItem('art_wifi_cliToken') || '';

        if (params.get('apMac')) localStorage.setItem('art_wifi_apMac', apMac);
        if (params.get('ssidName') || params.get('ssid')) localStorage.setItem('art_wifi_ssid', ssidName);
        if (params.get('cliToken')) localStorage.setItem('art_wifi_cliToken', cliToken);

        if (clientMac !== 'NOT_AVAILABLE') {
            document.getElementById('client-mac').innerText = clientMac;
            localStorage.setItem('art_wifi_mac', clientMac);
        } else {
            let savedMac = localStorage.getItem('art_wifi_mac');
            if (savedMac) clientMac = savedMac;
        }
        
        if (voucherParam) {
            document.getElementById('voucher-display').innerText = voucherParam;
            document.getElementById('voucher-input').value = voucherParam;
            localStorage.setItem('art_wifi_voucher', voucherParam);
        } else {
            let savedVoucher = localStorage.getItem('art_wifi_voucher');
            if (savedVoucher) {
                document.getElementById('voucher-display').innerText = savedVoucher;
                // Sadyang hindi na inilalagay sa voucher-input para laging malinis/blangko
                // ang text box tuwing binubuksan ang page nang walang URL param.
            }
        }
    }

    function formatTime(seconds) {
        if (seconds <= 0) return "00:00:00";
        var hrs = Math.floor(seconds / 3600);
        var mins = Math.floor((seconds % 3600) / 60);
        var secs = seconds % 60;

        return (hrs < 10 ? "0" + hrs : hrs) + ":" + 
               (mins < 10 ? "0" + mins : mins) + ":" + 
               (secs < 10 ? "0" + secs : secs);
    }

    function startLocalCountdown() {
        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(function() {
            if (remainingSeconds > 0) {
                remainingSeconds--;
                document.getElementById("time-remaining").innerText = formatTime(remainingSeconds);
                document.getElementById("status-text").innerText = "CONNECTED";
                document.getElementById("time-remaining").style.color = "var(--neon-cyan)";
            } else {
                document.getElementById("time-remaining").innerText = "EXPIRED";
                document.getElementById("time-remaining").style.color = "var(--danger-red)";
                document.getElementById("status-text").innerText = "EXPIRED";
                document.getElementById("status-text").style.color = "var(--danger-red)";
            }
        }, 1000);
    }

    // Function para i-check ang time gamit ang MAC o Voucher Code
    async function checkVoucherOnServer(code = "", showAlert = false) {
        try {
            let requestUrl = `${API_URL}/api/check-time?`;
            let params = [];

            if (clientMac && clientMac !== 'NOT_AVAILABLE') {
                params.push(`mac=${encodeURIComponent(clientMac)}`);
            }
            if (code) {
                params.push(`voucher=${encodeURIComponent(code)}`);
                params.push(`username=${encodeURIComponent(code)}`);
            }
            // Mga bagong parameter para sa EKSAKTONG live session check
            if (apMac) params.push(`apMac=${encodeURIComponent(apMac)}`);
            if (ssidName) params.push(`ssidName=${encodeURIComponent(ssidName)}`);
            if (cliToken) params.push(`cliToken=${encodeURIComponent(cliToken)}`);

            requestUrl += params.join('&');

            let res = await fetch(requestUrl);
            let data = await res.json();

            if (data.success) {
                remainingSeconds = data.remainingSeconds;
                if (data.mac && data.mac !== 'NOT_AVAILABLE') {
                    clientMac = data.mac;
                    document.getElementById('client-mac').innerText = clientMac;
                    localStorage.setItem('art_wifi_mac', clientMac);
                }
                if (code) {
                    document.getElementById('voucher-display').innerText = code;
                    localStorage.setItem('art_wifi_voucher', code);
                }
                startLocalCountdown();
                if (showAlert) alert("Tagumpay! Na-sync ang session time.");
                return true;
            } else {
                if (showAlert) alert("Hindi mahanap ang active session o invalid ang voucher code.");
                return false;
            }
        } catch (err) {
            console.log("Server sync failed:", err);
            if (showAlert) alert("Nagkaproblema sa pagkonekta sa server.");
            return false;
        }
    }

    // Button Click Event para sa Manual Input
    document.getElementById('check-btn').addEventListener('click', function() {
        var code = document.getElementById('voucher-input').value.trim();
        if (!code) {
            alert("Mangyaring maglagay muna ng voucher code.");
            return;
        }
        checkVoucherOnServer(code, true);
    });

    // Enter key support sa input box
    document.getElementById('voucher-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('check-btn').click();
        }
    });

    // Simulated ping animation
    setInterval(function() {
        var randomPing = Math.floor(Math.random() * (22 - 8 + 1)) + 8;
        var pingEl = document.getElementById("ping-val");
        if(pingEl) pingEl.innerText = randomPing;
    }, 4000);

    window.addEventListener("DOMContentLoaded", async function() {
        parseURLParams();
        
        let currentVoucher = document.getElementById('voucher-input').value.trim();
        // Subukang mag-sync agad pagka-buklod ng page
        await checkVoucherOnServer(currentVoucher, false);

        // Background auto-sync tuwing 10 segundo para laging updated ang oras mula sa Omada
        if (syncInterval) clearInterval(syncInterval);
        syncInterval = setInterval(function() {
            let activeVoucher = document.getElementById('voucher-input').value.trim();
            checkVoucherOnServer(activeVoucher, false);
        }, 10000);
    });
</script>
</body>
</html>
